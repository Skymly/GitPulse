name: Build and Test

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-platform library tests (Linux, macOS).
  # The App project targets net10.0-windows / net10.0-android, so only the
  # library projects (Core/GitHubApi/Services) and tests are built here.
  ci-lib:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history required by MinVer (Git-tag-based versioning).
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run library CI via Nuke (CiLib)
        run: dotnet run --project build/_build.csproj -- --root . --target CiLib --configuration Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-coverage-${{ matrix.os }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  # Full CI on Windows: format check + full solution build (incl. MAUI App) + tests.
  # Android compile gate: CiAll → Ci → Compile → CompileAndroid (net10.0-android; ADR-011 / #32).
  # For Android-only locally: ./build.ps1 --target CiAndroid --configuration Release
  # This job only compiles; Release Artifacts (Win zip / signed APK) are produced
  # by the release job on v* tags (ADR-014 dual-artifact from v0.1.1+).
  # Runbook / Secrets 契约: docs/DEVELOPMENT.md (ADR-014).
  ci-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history required by MinVer (Git-tag-based versioning).
          fetch-depth: 0

      - name: Setup .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run full CI via Nuke (CiAll)
        env:
          # dotnet format internally spawns a child process to load the
          # workspace; DOTNET_ROOT ensures it finds the correct SDK.
          DOTNET_ROOT: ${{ steps.setup-dotnet.outputs.dotnet-path }}
        run: dotnet run --project build/_build.csproj -- --root . --target CiAll --configuration Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-windows
          path: TestResults/
          if-no-files-found: warn

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-coverage-windows
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  # Release job (v* tags): Win publish-folder zip + CI-signed Android APK
  # Release Artifacts (ADR-014 / v0.1.1+). Nuke Release fails when any
  # ANDROID_* secret or artifact is missing (fail closed). Android Emulator
  # UI Smoke is a cut checklist item — not a hard step in this job. No AAB.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci-lib, ci-windows]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history required by MinVer (Git-tag-based versioning).
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run release pipeline via Nuke (Release)
        env:
          # Android signing Secrets contract: docs/DEVELOPMENT.md (ADR-014).
          # Unset secrets become empty values and fail the Nuke Release target.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: dotnet run --project build/_build.csproj -- --root . --target Release --configuration Release

      - name: Upload Windows publish zip artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GitPulse-win-x64
          path: artifacts/GitPulse-win-x64.zip
          if-no-files-found: error

      - name: Upload signed Android APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GitPulse-android
          path: artifacts/GitPulse-android.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/GitPulse-win-x64.zip
            artifacts/GitPulse-android.apk
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
