<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitPulse surfaces prototype</title>
  <!--
    Three variants of PR + Search, plus pick W.
    W = B Conversation (strip + rail) + B Files (list|diff) + B one-row
    Search hubs with A's SearchBar only on typed Search.
    Locked chrome from prototype/ux-chrome W. Throwaway. Not App code.
  -->
  <style>
    :root {
      --accent: #0078D4;
      --accent-hover: #106EBE;
      --open: #107C10;
      --done: #5C2D91;
      --danger: #C42B1C;
      --draft: #6E6E6E;
      --attention: #9D5D00;
      --skip: #5D5D5D;
      --add: #107C10;
      --del: #C42B1C;
      --chrome-base: #F3F3F3;
      --chrome-mica: rgba(243, 243, 243, 0.72);
      --chrome-page: #FFFFFF;
      --chrome-card: #F9F9F9;
      --chrome-line: #E5E5E5;
      --chrome-text: #1A1A1A;
      --chrome-muted: #5D5D5D;
      --chrome-fill: #E8E8E8;
      --focus: #0078D4;
      --radius-ctrl: 4px;
      --radius-surf: 8px;
      --font: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      --mono: "Cascadia Code", "Consolas", ui-monospace, monospace;
    }
    [data-theme="dark"] {
      --accent: #60CDFF;
      --accent-hover: #99EBFF;
      --open: #6CCB5F;
      --done: #B9A0D0;
      --danger: #FF99A4;
      --draft: #9A9A9A;
      --attention: #FCE100;
      --skip: #C8C8C8;
      --add: #6CCB5F;
      --del: #FF99A4;
      --chrome-base: #202020;
      --chrome-mica: rgba(32, 32, 32, 0.72);
      --chrome-page: #2C2C2C;
      --chrome-card: #323232;
      --chrome-line: #3F3F3F;
      --chrome-text: #FFFFFF;
      --chrome-muted: #C8C8C8;
      --chrome-fill: #3A3A3A;
      --focus: #60CDFF;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: var(--font);
      background: #6B7380;
      color: var(--chrome-text);
    }
    body:has([data-theme="dark"]) { background: #0E0E10; }
    body { display: flex; flex-direction: column; min-height: 100%; }
    button, a, input, textarea, select { font-family: inherit; }
    button:focus-visible, [tabindex="0"]:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .row-a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .desktop {
      flex: 1; display: flex; align-items: stretch; justify-content: center;
      padding: 16px; min-height: 0; height: calc(100vh - 64px);
    }
    .window {
      width: min(1180px, 100%);
      height: 100%; max-height: 100%;
      display: flex; flex-direction: column;
      border-radius: 8px; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,.28);
      background:
        radial-gradient(1200px 400px at 10% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 55%),
        var(--chrome-base);
      color: var(--chrome-text);
    }
    .titlebar {
      display: flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 0 0 12px;
      background: var(--chrome-mica);
      backdrop-filter: blur(28px) saturate(1.2);
      font-size: 12px; user-select: none;
    }
    .mark { width: 16px; height: 16px; color: var(--chrome-text); flex: none; }
    .titlebar .product { font-weight: 600; }
    .caption { margin-left: auto; display: flex; height: 100%; }
    .caption span { width: 46px; display: grid; place-items: center; font-size: 10px; color: var(--chrome-muted); }
    .caption span.close:hover { background: #C42B1C; color: #fff; }

    .shell { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--chrome-page); }
    .page { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--chrome-page); }

    .cap { font-size: 12px; line-height: 16px; color: var(--chrome-muted); }
    .body { font-size: 14px; line-height: 20px; }
    .section { font-size: 16px; line-height: 22px; font-weight: 600; }
    .page-title { font-size: 20px; line-height: 26px; font-weight: 600; }
    .icon16 { width: 16px; height: 16px; flex: none; }
    .icon20 { width: 20px; height: 20px; flex: none; }

    .a-tabs {
      display: flex; gap: 4px; padding: 4px 12px 0;
      background: var(--chrome-mica);
      backdrop-filter: blur(28px);
      border-bottom: 1px solid var(--chrome-line);
    }
    .a-tab {
      display: flex; align-items: center; gap: 8px;
      min-height: 44px; padding: 0 14px;
      border: 0; background: transparent; color: var(--chrome-text);
      font-size: 14px; border-radius: var(--radius-ctrl) var(--radius-ctrl) 0 0;
      cursor: pointer;
    }
    .a-tab:hover { background: color-mix(in srgb, var(--chrome-text) 6%, transparent); }
    .a-tab[aria-current="page"] {
      color: var(--accent); font-weight: 600;
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .list-a { overflow: auto; flex: 1; }
    .row-a {
      display: grid;
      grid-template-columns: 3px 16px 1fr auto;
      column-gap: 10px; align-items: start;
      min-height: 52px; padding: 8px 16px;
      border-bottom: 1px solid var(--chrome-line);
      cursor: pointer; background: transparent; width: 100%; text-align: left;
      color: inherit; border-left: 0; border-right: 0; border-top: 0;
    }
    .row-a:hover { background: color-mix(in srgb, var(--chrome-text) 4%, transparent); }
    .row-a .unread { background: var(--accent); align-self: stretch; border-radius: 1px; }
    .row-a .unread.off { background: transparent; }
    .row-a .title { font-size: 14px; font-weight: 600; line-height: 20px; }
    .row-a .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }

    .hdr-b {
      display: flex; flex-direction: column; gap: 8px;
      padding: 12px 20px 16px;
      border-bottom: 1px solid var(--chrome-line);
      flex: none;
    }
    .hdr-b .crumb { display: flex; align-items: center; gap: 8px; }
    .hdr-b .band {
      display: grid; grid-template-columns: 16px 1fr; column-gap: 12px; align-items: start;
    }
    .state {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: var(--st, var(--chrome-muted));
    }
    .reason { font-size: 12px; color: var(--chrome-muted); }

    .ghost {
      min-width: 44px; min-height: 44px; padding: 0 10px;
      border: 0; background: transparent; color: var(--accent);
      font-size: 14px; cursor: pointer; border-radius: var(--radius-ctrl);
    }
    .ghost:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .btn {
      min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-ctrl);
      font-size: 14px; cursor: pointer;
      background: var(--chrome-fill); color: var(--chrome-text);
    }
    .btn:hover { filter: brightness(0.97); }
    .btn-accent { background: var(--accent); color: #fff; }
    [data-theme="dark"] .btn-accent { color: #1A1A1A; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-quiet { background: transparent; color: var(--accent); }
    .seg {
      display: flex; gap: 8px; padding: 8px 16px; flex: none;
    }
    .seg button {
      flex: 1; min-height: 44px; border: 0; border-radius: var(--radius-ctrl);
      background: var(--chrome-fill); color: var(--chrome-text); font-size: 14px; cursor: pointer;
    }
    .seg button[aria-current="true"] { background: var(--accent); color: #fff; font-weight: 600; }
    [data-theme="dark"] .seg button[aria-current="true"] { color: #1A1A1A; }

    .scroll { flex: 1; overflow: auto; min-height: 0; }
    .stack { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 24px; }
    .card {
      border: 1px solid var(--chrome-line); border-radius: var(--radius-surf);
      background: var(--chrome-page); padding: 14px 16px;
    }
    .md { font-size: 14px; line-height: 22px; }
    .md p { margin: 0 0 8px; }
    .md code { font-family: var(--mono); font-size: 12px; background: var(--chrome-fill); padding: 1px 4px; border-radius: 3px; }
    .refs { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; color: var(--chrome-muted); }
    .refs span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .label-swatch {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--chrome-text);
    }
    .label-swatch i {
      width: 10px; height: 10px; border-radius: 2px; display: inline-block;
      background: var(--sw, #d73a4a);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .field { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--chrome-line);
      border-radius: var(--radius-ctrl); background: var(--chrome-page); color: var(--chrome-text); font-size: 14px; }
    textarea.field { min-height: 88px; resize: vertical; }
    .searchbar {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 16px 8px;
    }
    .searchbar input { min-height: 44px; }

    .page-error {
      margin: 12px 16px 0; padding: 12px 14px;
      border-radius: var(--radius-surf);
      background: color-mix(in srgb, var(--danger) 12%, var(--chrome-page));
      border: 1px solid color-mix(in srgb, var(--danger) 40%, var(--chrome-line));
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    }
    .page-error .msg { color: var(--danger); font-size: 14px; font-weight: 600; }
    .field-error { font-size: 12px; color: var(--danger); padding: 0 16px 8px; }
    .empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 32px 16px; text-align: center;
    }
    .empty h2 { margin: 0; font-size: 16px; }
    .empty p { margin: 0; font-size: 14px; color: var(--chrome-muted); max-width: 360px; }

    .more {
      min-height: 44px; margin: 8px 16px 20px; width: calc(100% - 32px);
      border: 1px solid var(--chrome-line); background: transparent; color: var(--accent);
      border-radius: var(--radius-ctrl); cursor: pointer; font-size: 14px;
    }

    /* Variant B split */
    .split { flex: 1; display: flex; min-height: 0; }
    .rail {
      width: 260px; flex: none; overflow: auto;
      border-left: 1px solid var(--chrome-line);
      padding: 12px 14px; display: flex; flex-direction: column; gap: 14px;
      background: var(--chrome-page);
    }
    .file-col {
      width: 240px; flex: none; overflow: auto;
      border-right: 1px solid var(--chrome-line);
    }
    .file-item {
      display: grid; grid-template-columns: 1fr auto; gap: 8px;
      width: 100%; text-align: left; padding: 10px 12px; min-height: 44px;
      border: 0; border-bottom: 1px solid var(--chrome-line);
      background: transparent; color: inherit; cursor: pointer; font-size: 12px;
    }
    .file-item[aria-current="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .file-item .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
    .pm { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pm .a { color: var(--add); }
    .pm .d { color: var(--del); }

    /* Variant C */
    .hub-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 8px 16px 16px; }
    .hub-card {
      min-height: 88px; padding: 14px; text-align: left; cursor: pointer;
      border: 1px solid var(--chrome-line); border-radius: var(--radius-surf);
      background: var(--chrome-card); color: inherit;
    }
    .hub-card .count { font-size: 20px; font-weight: 600; }
    .c-search-hero { padding: 20px 16px 8px; }
    .c-search-hero .field { font-size: 16px; min-height: 48px; }
    .tree { width: 200px; flex: none; overflow: auto; border-right: 1px solid var(--chrome-line); padding: 8px 0; }
    .tree button {
      display: block; width: 100%; text-align: left; border: 0; background: transparent;
      color: inherit; padding: 8px 12px; min-height: 36px; font-size: 12px; font-family: var(--mono); cursor: pointer;
    }
    .tree button[aria-current="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
    .life-strip {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 8px 20px 12px; border-bottom: 1px solid var(--chrome-line);
    }

    .diff {
      font-family: var(--mono); font-size: 12px; line-height: 18px;
      border: 1px solid var(--chrome-line); border-radius: var(--radius-ctrl); overflow: hidden;
    }
    .diff .h { padding: 8px 10px; background: var(--chrome-card); font-weight: 600; }
    .diff .ln { display: grid; grid-template-columns: 40px 1fr; }
    .diff .n { color: var(--chrome-muted); text-align: right; padding: 0 8px; user-select: none; }
    .diff .ctx { background: transparent; }
    .diff .add { background: color-mix(in srgb, var(--add) 14%, transparent); }
    .diff .rem { background: color-mix(in srgb, var(--del) 14%, transparent); }
    .diff .meta { color: var(--chrome-muted); padding: 4px 10px; background: var(--chrome-fill); }

    .timeline { display: flex; flex-direction: column; gap: 12px; }
    .who { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .who strong { font-size: 13px; }
    .check { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 13px; }

    .overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,.35);
      display: grid; place-items: center; z-index: 10;
    }
    .dialog {
      width: min(440px, calc(100% - 32px));
      background: var(--chrome-page); color: var(--chrome-text);
      border-radius: var(--radius-surf); padding: 20px;
      box-shadow: 0 16px 48px rgba(0,0,0,.28);
      border: 1px solid var(--chrome-line);
    }
    .dialog h2 { margin: 0 0 8px; font-size: 16px; }
    .dialog p { margin: 0 0 16px; font-size: 14px; line-height: 20px; }
    .dialog .row { display: flex; justify-content: flex-end; gap: 8px; }

    .window { position: relative; }

    .switcher {
      position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: #111; color: #fff; border-radius: 999px;
      padding: 6px 8px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
      z-index: 20; font-size: 12px; margin: 0 auto 12px; max-width: calc(100% - 24px); justify-content: center;
    }
    .switcher button {
      min-width: 36px; min-height: 36px; padding: 0 10px; border: 0; border-radius: 999px;
      background: #333; color: #fff; cursor: pointer; font-size: 12px;
    }
    .switcher button:hover { background: #444; }
    .switcher button.on { background: #fff; color: #111; }
    .switcher .label { min-width: 220px; text-align: center; font-weight: 600; }
    .switcher .sep { width: 1px; height: 20px; background: #444; }
  </style>
</head>
<body>

    <symbol id="mark" viewBox="0 0 16 16">
      <g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round">

      <circle cx="3.4" cy="8" r="1.15" fill="currentColor"/>

      <circle cx="8" cy="12.6" r="1.15" fill="currentColor"/>
      <circle cx="12.6" cy="8" r="1.15" fill="currentColor"/>

    <symbol id="ic-repos" viewBox="0 0 20 20"><path fill="currentColor" d="M4 3.5A1.5 1.5 0 0 1 5.5 2h9A1.5 1.5 0 0 1 16 3.5V16l-3-1.5L10 16l-3-1.5L4 16V3.5Zm1.5-.5a.5.5 0 0 0-.5.5v10.6l2-1 3 1.5 3-1.5 2 1V3.5a.5.5 0 0 0-.5-.5h-9Z"/></symbol>
    <symbol id="ic-repos-fill" viewBox="0 0 20 20"><path fill="currentColor" d="M5.5 2A1.5 1.5 0 0 0 4 3.5V16l3-1.5 3 1.5 3-1.5 3 1.5V3.5A1.5 1.5 0 0 0 14.5 2h-9Z"/></symbol>
    <symbol id="ic-bell" viewBox="0 0 20 20"><path fill="currentColor" d="M10 2a6 6 0 0 0-6 6v2.3L2.6 13a1 1 0 0 0 .8 1.6H7a3 3 0 0 0 6 0h3.6a1 1 0 0 0 .8-1.6L16 10.3V8a6 6 0 0 0-6-6Zm0 14a2 2 0 0 1-1.9-1.4h3.8A2 2 0 0 1 10 16Zm-5-3.4.9-1.3V8a5 5 0 1 1 10 0v3.3l.9 1.3H5Z"/></symbol>
    <symbol id="ic-bell-fill" viewBox="0 0 20 20"><path fill="currentColor" d="M10 2a6 6 0 0 0-6 6v2.3L2.6 13a1 1 0 0 0 .8 1.6H7a3 3 0 0 0 6 0h3.6a1 1 0 0 0 .8-1.6L16 10.3V8a6 6 0 0 0-6-6Zm0 14a2 2 0 0 1-1.9-1.4h3.8A2 2 0 0 1 10 16Z"/></symbol>

    <symbol id="ic-gear" viewBox="0 0 20 20"><path fill="currentColor" d="M8.2 2.1h3.6l.4 1.7a6 6 0 0 1 1.6.9l1.7-.5 1.8 3.1-1.3 1.2c.1.4.2.8.2 1.2s-.1.8-.2 1.2l1.3 1.2-1.8 3.1-1.7-.5a6 6 0 0 1-1.6.9l-.4 1.7H8.2l-.4-1.7a6 6 0 0 1-1.6-.9l-1.7.5-1.8-3.1 1.3-1.2A6 6 0 0 1 3.8 10c0-.4.1-.8.2-1.2L2.7 7.6l1.8-3.1 1.7.5a6 6 0 0 1 1.6-.9l.4-1.7ZM10 7.5A2.5 2.5 0 1 0 10 12.5 2.5 2.5 0 0 0 10 7.5Z"/></symbol>

    <symbol id="oct-x" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></symbol>

    <symbol id="oct-repo" viewBox="0 0 16 16"><path fill="currentColor" d="M3 2.5A1.5 1.5 0 0 1 4.5 1h7A1.5 1.5 0 0 1 13 2.5V14l-2.5-1.2L8 14l-2.5-1.2L3 14V2.5Z" opacity=".2"/><path fill="none" stroke="currentColor" stroke-width="1.25" d="M4.5 1.6h7A.9.9 0 0 1 12.4 2.5V13l-2.2-1L8 13.2 5.8 12l-2.2 1V2.5A.9.9 0 0 1 4.5 1.6Z"/></symbol>
  </svg>

  <div class="desktop">
    <div class="window" id="app"></div>
  </div>

  <div class="switcher" aria-label="Prototype switcher">
    <button type="button" id="prev" title="Previous variant">←</button>
    <div class="label" id="variantLabel"></div>
    <button type="button" id="next" title="Next variant">→</button>
    <div class="sep"></div>
    <button type="button" data-surface="pr">PR</button>
    <button type="button" data-surface="search">Search</button>
    <div class="sep"></div>
    <button type="button" data-scene="conversation">Conversation</button>
    <button type="button" data-scene="files">Files</button>

      }
      if (state.scene === "page") {
        return `<div class="c-search-hero">${searchBar("GitPulse", false)}</div>${pageError("Search rate limited. Try again later.", "")}${listRows(TYPED)}`;
      }
      return `<div class="c-search-hero">${searchBar("", false)}</div>${cards}`;
    }

    function searchW() {
      const hub = state.scene === "review" ? "Review" : state.scene === "assigned" ? "Assigned" : state.scene === "mentions" ? "Mentions" : "Search";
      const segs = [
        ["Search", "typed"], ["Review", "review"], ["Assigned", "assigned"], ["Mentions", "mentions"],
      ];
      const nav = `<div class="seg">${segs.map(([t, sc]) => `<button type="button" aria-current="${t === hub}" data-scene="${sc}">${t}</button>`).join("")}</div>`;
      if (state.scene === "review") return `${nav}${listRows(INBOX)}`;
      if (state.scene === "assigned") return `${nav}${listRows(ASSIGNED)}`;
      if (state.scene === "mentions") return `${nav}${listRows(MENTIONS)}`;
      const bar = searchBar(state.scene === "field" ? "ab" : state.scene === "empty" ? "xyzzy-no-hit" : "GitPulse", true);
      if (state.scene === "empty") {
        return `${nav}${bar}${typeTabs("PRs")}<div class="empty"><h2>No results</h2><p>No pull requests match this query. The SearchBar is the next step.</p></div>`;
      }
      if (state.scene === "field") {
        return `${nav}${bar}<div class="field-error">Enter at least 3 characters.</div>${typeTabs("PRs")}`;
      }
      if (state.scene === "page") {
        return `${nav}${bar}${pageError("Search rate limited. Try again later.", "")}${typeTabs("PRs")}${listRows(TYPED)}`;
      }
      return `${nav}${bar}${typeTabs("PRs")}<div class="cap" style="padding:0 16px 8px">1,204 results</div>${listRows(TYPED)}`;
    }

    function prBody() {
      const v = state.variant;
      const scene = state.scene === "confirm" ? "conversation" : state.scene;
      if (v === "A") return scene === "files" ? filesA() : conversationA();
      if (v === "C") return scene === "files" ? filesC() : conversationC();
      return scene === "files" ? filesB() : conversationB();
    }
    function searchBody() {
      if (state.variant === "A") return searchA();
      if (state.variant === "B") return searchB();
      if (state.variant === "C") return searchC();
      return searchW();
    }

    function render() {
      const app = document.getElementById("app");
      document.documentElement.setAttribute("data-theme", state.theme);
      app.setAttribute("data-theme", state.theme);
      const isPr = state.surface === "pr";
      const tabs = isPr ? "" : tabsA();
      const page = isPr
        ? `${headerB("Pull requests")}${prBody()}`
        : searchBody();
      app.innerHTML = `${titlebar()}<div class="shell">${tabs}<div class="page">${page}</div></div>${confirmDialog()}`;

      const v = VARIANTS.find(x => x.key === state.variant);
      document.getElementById("variantLabel").textContent = `${v.key} — ${v.name}`;
      document.querySelectorAll("[data-surface]").forEach(b => b.classList.toggle("on", b.dataset.surface === state.surface));
      document.querySelectorAll("[data-scene]").forEach(b => {
        if (!b.closest(".switcher")) return;
        b.classList.toggle("on", b.dataset.scene === state.scene);
        const prScenes = ["conversation", "files", "confirm"];
        const searchScenes = ["typed", "review", "empty", "field", "page"];
        b.hidden = isPr ? !prScenes.includes(b.dataset.scene) : !searchScenes.includes(b.dataset.scene);
      });
      document.getElementById("themeLight").classList.toggle("on", state.theme === "light");
      document.getElementById("themeDark").classList.toggle("on", state.theme === "dark");

      const url = new URL(location.href);
      url.searchParams.set("variant", state.variant);
      url.searchParams.set("surface", state.surface);
      url.searchParams.set("scene", state.scene);
      url.searchParams.set("theme", state.theme);
      history.replaceState(null, "", url);
    }

    function setVariant(key) { state.variant = key; render(); }
    function cycle(dir) {
      const i = VARIANTS.findIndex(v => v.key === state.variant);
      setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
    }

    document.getElementById("prev").onclick = () => cycle(-1);
    document.getElementById("next").onclick = () => cycle(1);
    document.getElementById("themeLight").onclick = () => { state.theme = "light"; render(); };
    document.getElementById("themeDark").onclick = () => { state.theme = "dark"; render(); };
    document.querySelector(".switcher").addEventListener("click", (e) => {
      const s = e.target.closest("[data-surface]");
      if (s) {
        state.surface = s.dataset.surface;
        state.scene = state.surface === "pr" ? "conversation" : "typed";
        render();
      }
      const sc = e.target.closest("[data-scene]");
      if (sc && sc.closest(".switcher")) { state.scene = sc.dataset.scene; render(); }
    });
    document.getElementById("app").addEventListener("click", (e) => {
      const scene = e.target.closest("[data-scene]");
      if (scene) { state.scene = scene.dataset.scene; render(); return; }
      const file = e.target.closest("[data-file]");
      if (file) { state.file = Number(file.dataset.file); render(); return; }
      if (e.target.closest("[data-open-merge]")) { state.scene = "confirm"; render(); return; }
      if (e.target.closest("[data-cancel-merge]")) { state.scene = "conversation"; render(); return; }
      if (e.target.closest("[data-do-merge]")) { state.scene = "conversation"; render(); }
    });
    document.getElementById("app").addEventListener("change", (e) => {
      if (e.target.matches("[data-method]")) state.mergeMethod = e.target.value;
    });
    document.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable || t.tagName === "SELECT")) return;
      if (e.key === "ArrowLeft") cycle(-1);
      if (e.key === "ArrowRight") cycle(1);
      if (e.key === "Escape" && state.scene === "confirm") { state.scene = "conversation"; render(); }
    });

    const params = new URLSearchParams(location.search);
    if (["A", "B", "C", "W"].includes(params.get("variant"))) state.variant = params.get("variant");
    if (["pr", "search"].includes(params.get("surface"))) state.surface = params.get("surface");
    if (params.get("scene")) state.scene = params.get("scene");
    if (["light", "dark"].includes(params.get("theme"))) state.theme = params.get("theme");
    render();
  </script>
</body>
</html>
